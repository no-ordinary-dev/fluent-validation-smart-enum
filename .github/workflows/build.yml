name: Build

on:
  push:
    branches:
      - main
  pull_request:
  release:
    types:
      - published
  workflow_dispatch:

env:
  # Disable the .NET logo in the console output.
  DOTNET_NOLOGO: true
  # Disable the .NET first time experience to skip caching NuGet packages and speed up the build.
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # Disable sending .NET CLI telemetry to Microsoft.
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Set the build number in MinVer.
  MINVERBUILDMETADATA: build.${{github.run_number}}

jobs:
  build:
    name: Build-${{matrix.os}}
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7
        with:
          lfs: true
          fetch-depth: 0
      - name: "Install .NET Core SDK"
        uses: actions/setup-dotnet@v6
      - name: "Dotnet Tool Restore"
        run: dotnet tool restore
        shell: pwsh
      - name: "Dotnet Cake Build"
        run: dotnet cake --target=Build
        shell: pwsh
      - name: "Dotnet Cake Test"
        run: dotnet cake --target=Test
        shell: pwsh
      - name: "Dotnet Cake Pack"
        run: dotnet cake --target=Pack
        shell: pwsh
      - name: "Publish Artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: ${{matrix.os}}
          path: "./Artifacts"

  push-github-packages:
    name: "Push GitHub Packages"
    needs: build
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'
    environment:
      name: "GitHub Packages"
      url: https://github.com/no-ordinary-dev/fluent-validation-smart-enum/packages
    permissions:
      packages: write
    runs-on: windows-latest
    steps:
      - name: "Download Artifact"
        uses: actions/download-artifact@v8
        with:
          name: "windows-latest"
          digest-mismatch: warn
      - name: "Dotnet NuGet Add Source"
        run: dotnet nuget add source https://nuget.pkg.github.com/no-ordinary-dev/index.json --name GitHub --username no-ordinary-dev --password ${{secrets.GITHUB_TOKEN}}
        shell: pwsh
      - name: "Dotnet NuGet Push"
        run: dotnet nuget push .\*.nupkg --api-key ${{ github.token }} --source GitHub --skip-duplicate
        shell: pwsh

  push-nuget:
    name: "Push NuGet Packages"
    needs: build
    if: github.event_name == 'release'
    permissions:
      id-token: write
    environment:
      name: "NuGet"
      url: https://www.nuget.org/packages/NoOrdinaryDev.FluentValidation.SmartEnum
    runs-on: windows-latest
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_KEY_VAULT_URL: ${{ vars.AZURE_KEY_VAULT_URL }}
      AZURE_KEY_VAULT_CERTIFICATE_NAME: ${{ vars.AZURE_KEY_VAULT_CERTIFICATE_NAME }}
      NUGET_SIGNING_CERTIFICATE_SHA256: ${{ vars.NUGET_SIGNING_CERTIFICATE_SHA256 }}
    steps:
      - name: "Download Artifact"
        uses: actions/download-artifact@v8
        with:
          name: "windows-latest"
          digest-mismatch: warn
      - name: "Validate Signing Configuration"
        shell: pwsh
        run: |
          foreach ($name in @('AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_KEY_VAULT_URL', 'AZURE_KEY_VAULT_CERTIFICATE_NAME', 'NUGET_SIGNING_CERTIFICATE_SHA256')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing NuGet environment variable: $name. See docs/nuget-signing.md."
            }
          }
          if ($env:NUGET_SIGNING_CERTIFICATE_SHA256 -notmatch '^[0-9A-Fa-f]{64}$') {
            throw 'NUGET_SIGNING_CERTIFICATE_SHA256 must be a SHA-256 certificate fingerprint (64 hexadecimal characters, no separators).'
          }
      - name: "Install Signing SDK"
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: "Install Sign CLI"
        shell: pwsh
        run: dotnet tool install sign --version 0.9.1-beta.26475.3 --tool-path "$env:RUNNER_TEMP\sign-tool" --source https://api.nuget.org/v3/index.json
      - name: "Azure Login"
        uses: azure/login@v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: "Sign and Verify NuGet Packages"
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem .\ -File -Filter *.nupkg |
            Where-Object { !$_.Name.Contains('preview') })
          if ($packages.Count -eq 0) {
            throw 'No non-preview NuGet packages were found to sign and publish.'
          }
          foreach ($package in $packages) {
            & "$env:RUNNER_TEMP\sign-tool\sign.exe" code azure-key-vault $package.FullName `
              --azure-key-vault-url "$env:AZURE_KEY_VAULT_URL" `
              --azure-key-vault-certificate "$env:AZURE_KEY_VAULT_CERTIFICATE_NAME" `
              --azure-credential-type azure-cli `
              --recurse-containers false `
              --file-digest sha256 `
              --timestamp-url http://timestamp.digicert.com `
              --timestamp-digest sha256
            if ($LASTEXITCODE -ne 0) {
              throw "NuGet author signing failed for $($package.Name)."
            }
            dotnet nuget verify $package.FullName --all --certificate-fingerprint "$env:NUGET_SIGNING_CERTIFICATE_SHA256"
            if ($LASTEXITCODE -ne 0) {
              throw "NuGet signature verification failed for $($package.Name)."
            }
          }
      - name: "NuGet Login"
        uses: NuGet/login@v1.2.0
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}
      - name: "Dotnet NuGet Push"
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          Get-ChildItem .\ -File -Filter *.nupkg |
          Where-Object { !$_.Name.Contains('preview') } |
          ForEach-Object {
            dotnet nuget push $_.FullName --source https://api.nuget.org/v3/index.json --skip-duplicate --api-key "$env:NUGET_API_KEY"
            if ($LASTEXITCODE -ne 0) {
              throw "NuGet publishing failed for $($_.Name)."
            }
          }
        shell: pwsh
